# Compile-checks the app's Kotlin on every push to a work branch. The native
# engine is built separately (QNN SDK), so this only covers the Gradle side.
name: Kotlin check

on:
  push:
    branches: ["claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kotlin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The runner image ships the Android SDK; add the platform this app
      # compiles against.
      - name: SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, lint and unit tests
        run: ./gradlew --no-daemon --stacktrace :app:compileBasicDebugKotlin :app:ktlintCheck :app:testBasicDebugUnitTest
