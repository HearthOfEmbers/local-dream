# Compile-checks the app's Kotlin on every push to a work branch. The native
# engine is built separately (QNN SDK), so this only covers the Gradle side.
name: Kotlin check

on:
  push:
    branches: ["claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kotlin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, lint and unit tests
        run: ./gradlew --no-daemon --stacktrace :app:compileBasicDebugKotlin :app:ktlintCheck :app:testBasicDebugUnitTest
